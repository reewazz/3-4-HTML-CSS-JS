<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment Form</title>
</head>
<body>
    <h1>Course Enrollment Form</h1>
    
    <form action="/submit-enrollment" method="POST" enctype="multipart/form-data">
        
        <!-- Full Name -->
        <div>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <!-- Email -->
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- Phone Number -->
        <div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <!-- Course Selection -->
        <div>
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Choose a Course --</option>
                <option value="mern">MERN Stack</option>
                <option value="python">Python</option>
                <option value="uiux">UI/UX</option>
                <option value="java">Java</option>
            </select>
        </div>

        <!-- Gender -->
        <fieldset>
            <legend>Gender:</legend>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
            </div>
            <div>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>
            <div>
                <input type="radio" id="other" name="gender" value="other" required>
                <label for="other">Other</label>
            </div>
        </fieldset>

        <!-- Skills -->
        <fieldset>
            <legend>Select Your Skills:</legend>
            <div>
                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html">HTML</label>
            </div>
            <div>
                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css">CSS</label>
            </div>
            <div>
                <input type="checkbox" id="javascript" name="skills" value="Javascript">
                <label for="javascript">Javascript</label>
            </div>
            <div>
                <input type="checkbox" id="react" name="skills" value="React">
                <label for="react">React</label>
            </div>
            <div>
                <input type="checkbox" id="nodejs" name="skills" value="Node.js">
                <label for="nodejs">Node.js</label>
            </div>
        </fieldset>

        <!-- Date of Birth -->
        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <!-- Address -->
        <div>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" required></textarea>
        </div>

        <!-- Profile Picture -->
        <div>
            <label for="profilePic">Profile Picture:</label>
            <input type="file" id="profilePic" name="profilePic" accept="image/*" required>
        </div>

        <!-- Submit Button -->
        <div>
            <button type="submit">Submit Enrollment</button>
        </div>

    </form>

</body>
</html>
